name: mirror

# Раз в 5 минут копирует новые версии плеера и агента с yx.ru.net в релизы.
# GitHub запускает cron с задержкой (иногда до 15–30 минут) — не страшно:
# пока зеркала нет, ВМ качают с yx.ru.net.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Копировать новые версии
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash mirror.sh
      # В публичном репозитории GitHub выключает cron через 60 дней без
      # коммитов. Релизы коммитами не считаются — раз в 40 дней пустой коммит.
      - name: Не дать GitHub выключить cron
        run: |
          last="$(git log -1 --format=%ct)"
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'keepalive: cron не выключается'
            git push
          fi
